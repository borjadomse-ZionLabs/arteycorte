<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR espejo · Arte & Corte</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Playfair+Display:ital,wght@0,800;0,900;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
:root{--ink:#0e0d0c;--cream:#f3ebdc;--brass:#c9a35b;--brass2:#e3c98f;--brassD:#9c7a3b;--muted:#6d655a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9d2c4;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bar button{font:500 .9rem Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:12px 20px;border-radius:99px;border:0;background:var(--ink);color:var(--cream);cursor:pointer}
.poster{width:148mm;height:210mm;max-width:100%;background:var(--ink);color:var(--cream);border-radius:6px;padding:14mm 12mm;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.poster::before{content:"";position:absolute;inset:6mm;border:1px solid rgba(201,163,91,.5);border-radius:3px;pointer-events:none}
.poster::after{content:"";position:absolute;inset:7.5mm;border:1px solid rgba(201,163,91,.2);border-radius:2px;pointer-events:none}
.logo{font-family:"Playfair Display",serif;font-weight:900;font-size:22pt}.logo em{color:var(--brass);font-weight:600}
.sub{font-family:Oswald,sans-serif;letter-spacing:.3em;font-size:7.5pt;color:var(--brass);text-transform:uppercase;margin-top:2mm}
h1{font-family:"Playfair Display",serif;font-weight:900;font-size:30pt;line-height:1.02;margin-top:10mm}
h1 em{color:var(--brass2);font-weight:600}
.lead{font-size:10.5pt;color:rgba(243,235,220,.8);margin-top:4mm;max-width:105mm;line-height:1.45}
.qr{margin-top:8mm;padding:4mm;background:var(--cream);border-radius:4mm}
.qr img,.qr canvas{display:block;width:52mm!important;height:52mm!important}
.steps{display:flex;gap:4mm;margin-top:7mm;font-size:8.5pt;color:rgba(243,235,220,.85)}
.steps span{display:flex;align-items:center;gap:2mm}
.steps b{width:6mm;height:6mm;border-radius:50%;background:var(--brass);color:var(--ink);display:grid;place-items:center;font-size:8pt}
.foot{margin-top:auto;display:flex;align-items:center;gap:4mm;font-size:8pt;color:rgba(243,235,220,.7)}
.mini{background:var(--cream);padding:1.5mm;border-radius:1.5mm}
.mini img,.mini canvas{width:18mm!important;height:18mm!important;display:block}
.foot div{text-align:left;line-height:1.4}.foot b{color:var(--brass2);font-family:Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;font-weight:500;display:block}
@media print{body{background:none;padding:0}.bar{display:none}.poster{box-shadow:none;border-radius:0}@page{size:A5;margin:0}}
</style>
</head>
<body>
<div class="bar"><button onclick="print()">Imprimir (A5)</button></div>
<div class="poster">
  <div class="logo">Arte <em>&amp;</em> Corte</div>
  <div class="sub">Barbería · Sitges</div>
  <h1>¿Cada cuánto<br><em>te cortas?</em></h1>
  <p class="lead">Escanea, elige 3, 4 o 5 semanas y tu móvil te avisará cuando toque. Sin apps y sin dar tus datos.</p>
  <div class="qr" id="qr1"></div>
  <div class="steps"><span><b>1</b>Escanea</span><span><b>2</b>Elige semanas</span><span><b>3</b>Te avisamos</span></div>
  <div class="foot"><span class="mini" id="qr2"></span><div><b>Sin cita · espera en directo</b>Mira cuánta cola hay antes de venir</div></div>
</div>
<script>
const base = (window.SITE && SITE.url) || location.href.replace(/qr\.html.*$/, "");
new QRCode(document.getElementById("qr1"), { text: base + "#recordatorio", width: 400, height: 400, colorDark: "#0e0d0c", colorLight: "#f3ebdc", correctLevel: QRCode.CorrectLevel.M });
new QRCode(document.getElementById("qr2"), { text: base + "#ahora", width: 200, height: 200, colorDark: "#0e0d0c", colorLight: "#f3ebdc", correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
